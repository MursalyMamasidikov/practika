<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 40px 16px;
        }

        form {
            background: #fff;

            width: 100%;
            max-width: 420px;

            padding: 24px 32px;

            border-radius: 8px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 20px;
            margin: 0 0 20px;
        }

    
        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;

            padding: 9px 10px;

            border: 1px solid #ccc;
            border-radius: 4px;

            font-size: 15px;

            outline: none;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: #2563eb;
        }

        .radio-group {
            margin-bottom: 14px;
        }

        .radio-group > label:first-child {
            display: block;
            margin-bottom: 6px;
        }

        .radio-option {
            display: inline-flex;
            align-items: center;

            font-weight: normal;

            margin-right: 12px;
            margin-bottom: 0;
        }

        .radio-option input {
            margin-right: 5px;
        }

        .terms {
            margin-bottom: 14px;
        }

        .terms label {
            display: flex;
            align-items: center;

            gap: 6px;

            font-weight: normal;
            margin: 0;
        }

        .terms input {
            flex-shrink: 0;
        }

        button {
            width: 100%;

            padding: 10px;

            background: #2563eb;
            color: #fff;

            border: none;
            border-radius: 4px;

            font-size: 15px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {

            body {
                padding: 24px 12px;
            }

            form {
                padding: 22px 20px;
            }
        }

    
        @media (max-width: 400px) {

            body {
                padding: 16px 10px;
            }

            form {
                padding: 20px 16px;
                border-radius: 6px;
            }

            h1 {
                font-size: 18px;
                margin-bottom: 18px;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="date"],
            select {
                font-size: 14px;
                padding: 8px;
            }

            button {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <form action="/register" method="post">

        <h1>User Registration Form</h1>

        <div class="form-group">
            <label for="firstName">First Name:</label>

            <input
                type="text"
                id="firstName"
                name="firstname"
                required
            >
        </div>

        <div class="form-group">
            <label for="lastName">Last Name:</label>

            <input
                type="text"
                id="lastName"
                name="lastName"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address:</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password:</label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                required
            >
        </div>

        <div class="radio-group">

            <label>Gender</label>

            <label class="radio-option">
                <input
                    type="radio"
                    id="male"
                    name="gender"
                    value="male"
                    required
                >
                Male
            </label>

            <label class="radio-option">
                <input
                    type="radio"
                    id="female"
                    name="gender"
                    value="female"
                    required
                >
                Female
            </label>

        </div>

        <div class="form-group">

            <label for="dob">Date of Birth:</label>

            <input
                type="date"
                id="dob"
                name="dob"
                required
            >

        </div>

        <div class="form-group">

            <label for="country">Country:</label>

            <select
                id="country"
                name="country"
                required
            >
                <option value="">Select your country</option>
                <option value="USA">USA</option>
                <option value="Canada">Canada</option>
                <option value="UK">UK</option>
                <option value="Australia">Australia</option>
                <option value="Other">Other</option>
            </select>

        </div>

        <div class="terms">

            <label for="terms">

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required
                >

                <span>I agree to the terms and conditions</span>

            </label>

        </div>

        <div>

            <button type="submit">
                Register
            </button>

        </div>

    </form>

</body>
</html>
